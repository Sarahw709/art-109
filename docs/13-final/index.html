<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unstable Reflection</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <h1 class="title">Unstable Reflection</h1>
    </header>
    <main class="stage">
        <div class="video-stack">
            <video id="webcam" autoplay playsinline muted></video>
            <canvas id="display" width="640" height="480" aria-label="Distorted webcam feed"></canvas>
            <button
                type="button"
                class="error-overlay"
                aria-label="Dismiss error dialog"
                aria-hidden="true"
            >
                <img src="Generic_error_message.png" alt="" width="320" draggable="false" />
            </button>
        </div>
    </main>
    <script src="js/webcam.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/error-overlay.js"></script>
    <script src="js/title-glitch.js"></script>
</body>
</html>
